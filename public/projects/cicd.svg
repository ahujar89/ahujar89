<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Background code-like lines -->
  <g fill="rgba(255,255,255,0.04)" font-family="monospace" font-size="13">
    <text x="20" y="100">name: Build and Deploy</text>
    <text x="20" y="118">on: [push]</text>
    <text x="20" y="136">jobs:</text>
    <text x="20" y="154">  build:</text>
    <text x="20" y="172">    runs-on: ubuntu-latest</text>
    <text x="20" y="190">    steps:</text>
    <text x="20" y="208">      - uses: actions/checkout@v3</text>
    <text x="20" y="226">      - run: docker build .</text>
    <text x="20" y="244">      - run: docker push</text>
  </g>
  <!-- Central circular pipeline -->
  <!-- Outer track -->
  <circle cx="440" cy="225" r="130" fill="none" stroke="rgba(167,139,250,0.15)" stroke-width="18"/>
  <!-- Colored arc (progress) -->
  <circle cx="440" cy="225" r="130" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-dasharray="580 820" stroke-dashoffset="200" stroke-linecap="round"/>
  <!-- Stage nodes on the circle -->
  <!-- Code (top) -->
  <circle cx="440" cy="95" r="26" fill="#1e1b4b" stroke="rgba(167,139,250,0.8)" stroke-width="2.5"/>
  <!-- Code brackets icon -->
  <text x="440" y="102" font-family="monospace" font-size="20" fill="rgba(167,139,250,0.9)" text-anchor="middle">&lt;/&gt;</text>
  <text x="440" y="78" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.55)" text-anchor="middle">Code</text>
  <!-- Build (right) -->
  <circle cx="570" cy="225" r="26" fill="#1e1b4b" stroke="rgba(110,231,183,0.8)" stroke-width="2.5"/>
  <!-- Gear icon for build -->
  <circle cx="570" cy="225" r="12" fill="none" stroke="rgba(110,231,183,0.8)" stroke-width="2.5"/>
  <circle cx="570" cy="225" r="5" fill="rgba(110,231,183,0.6)"/>
  <rect x="567" y="210" width="6" height="5" rx="1" fill="rgba(110,231,183,0.8)"/>
  <rect x="567" y="236" width="6" height="5" rx="1" fill="rgba(110,231,183,0.8)"/>
  <rect x="555" y="222" width="5" height="6" rx="1" fill="rgba(110,231,183,0.8)"/>
  <rect x="580" y="222" width="5" height="6" rx="1" fill="rgba(110,231,183,0.8)"/>
  <text x="570" y="209" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.55)" text-anchor="middle">Build</text>
  <!-- Test (bottom-right) -->
  <circle cx="506" cy="337" r="26" fill="#1e1b4b" stroke="rgba(167,139,250,0.8)" stroke-width="2.5"/>
  <!-- Checkmark -->
  <polyline points="496,337 504,345 518,328" fill="none" stroke="rgba(167,139,250,0.9)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="506" y="320" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.55)" text-anchor="middle">Test</text>
  <!-- Deploy (bottom-left) -->
  <circle cx="374" cy="337" r="26" fill="#1e1b4b" stroke="rgba(110,231,183,0.8)" stroke-width="2.5"/>
  <!-- Rocket icon -->
  <path d="M 374 327 L 379 342 L 374 340 L 369 342 Z" fill="rgba(110,231,183,0.7)"/>
  <circle cx="374" cy="326" r="5" fill="rgba(110,231,183,0.5)" stroke="rgba(110,231,183,0.8)" stroke-width="1.5"/>
  <text x="374" y="320" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.55)" text-anchor="middle">Deploy</text>
  <!-- Docker logo area (center of ring) -->
  <!-- Docker whale simplified -->
  <g transform="translate(415,205)">
    <rect x="0" y="15" width="50" height="6" rx="2" fill="rgba(36,150,232,0.6)"/>
    <rect x="5" y="8" width="10" height="8" rx="1" fill="rgba(36,150,232,0.7)"/>
    <rect x="20" y="8" width="10" height="8" rx="1" fill="rgba(36,150,232,0.7)"/>
    <rect x="35" y="8" width="10" height="8" rx="1" fill="rgba(36,150,232,0.7)"/>
    <rect x="20" y="0" width="10" height="8" rx="1" fill="rgba(36,150,232,0.5)"/>
    <path d="M 50 18 Q 58 14 56 22 Q 64 18 60 28 L 50 28 Z" fill="rgba(36,150,232,0.6)"/>
    <path d="M 60 28 Q 58 35 50 35 L 10 35 Q 2 35 2 28" fill="none" stroke="rgba(36,150,232,0.5)" stroke-width="2"/>
  </g>
  <!-- GitHub Actions label -->
  <text x="440" y="192" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="middle">GitHub Actions</text>
  <!-- Title -->
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="bold">CI/CD Pipeline</text>
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">Containerised build · automated testing · deployment</text>
  <!-- Tech strip -->
  <rect x="210" y="376" width="380" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
  <text x="400" y="389" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Python · Flask · Docker · GitHub Actions</text>
</svg>
