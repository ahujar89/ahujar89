<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Radial glow behind orb -->
  <circle cx="320" cy="215" r="130" fill="url(#orbGlow)"/>
  <!-- Light rays from orb -->
  <g stroke="rgba(167,139,250,0.2)" stroke-width="1.5">
    <line x1="320" y1="215" x2="320" y2="100"/>
    <line x1="320" y1="215" x2="320" y2="330"/>
    <line x1="320" y1="215" x2="205" y2="215"/>
    <line x1="320" y1="215" x2="435" y2="215"/>
    <line x1="320" y1="215" x2="238" y2="133"/>
    <line x1="320" y1="215" x2="402" y2="297"/>
    <line x1="320" y1="215" x2="402" y2="133"/>
    <line x1="320" y1="215" x2="238" y2="297"/>
  </g>
  <!-- Outer glow ring -->
  <circle cx="320" cy="215" r="72" fill="none" stroke="rgba(167,139,250,0.25)" stroke-width="12"/>
  <!-- Middle ring -->
  <circle cx="320" cy="215" r="55" fill="none" stroke="rgba(167,139,250,0.2)" stroke-width="3"/>
  <!-- Central AI orb -->
  <circle cx="320" cy="215" r="42" fill="url(#centerOrb)"/>
  <!-- Orb inner sparkle -->
  <circle cx="307" cy="203" r="7" fill="rgba(255,255,255,0.35)"/>
  <circle cx="307" cy="203" r="3" fill="rgba(255,255,255,0.7)"/>
  <!-- Sparkle dots around orb -->
  <g fill="rgba(255,255,255,0.8)">
    <circle cx="320" cy="155" r="3"/>
    <circle cx="380" cy="215" r="3"/>
    <circle cx="320" cy="275" r="3"/>
    <circle cx="260" cy="215" r="3"/>
    <circle cx="361" cy="174" r="2"/>
    <circle cx="361" cy="256" r="2"/>
    <circle cx="279" cy="174" r="2"/>
    <circle cx="279" cy="256" r="2"/>
  </g>
  <!-- Star sparkles -->
  <g fill="rgba(167,139,250,0.9)">
    <!-- Star 1 -->
    <polygon points="200,130 203,140 213,140 205,147 208,157 200,150 192,157 195,147 187,140 197,140" transform="scale(0.6) translate(130,55)"/>
    <!-- Star 2 (small) -->
    <polygon points="700,100 702,107 709,107 703,112 705,119 700,114 695,119 697,112 691,107 698,107" transform="scale(0.5) translate(710,55)"/>
    <!-- Star 3 (tiny) -->
    <circle cx="160" cy="300" r="2.5"/>
    <circle cx="162" cy="293" r="1.5" fill="rgba(167,139,250,0.5)"/>
    <circle cx="169" cy="298" r="1.5" fill="rgba(167,139,250,0.5)"/>
  </g>
  <!-- Chat bubble 1 (user, left side of right panel) -->
  <g transform="translate(460, 135)">
    <rect x="0" y="0" width="150" height="48" rx="14" fill="rgba(167,139,250,0.25)" stroke="rgba(167,139,250,0.5)" stroke-width="1.5"/>
    <polygon points="14,48 2,62 28,48" fill="rgba(167,139,250,0.25)"/>
    <!-- "message" lines -->
    <rect x="14" y="14" width="100" height="6" rx="3" fill="rgba(255,255,255,0.35)"/>
    <rect x="14" y="27" width="70" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
  </g>
  <!-- Chat bubble 2 (AI, right) -->
  <g transform="translate(500, 210)">
    <rect x="0" y="0" width="170" height="64" rx="14" fill="rgba(34,211,238,0.18)" stroke="rgba(34,211,238,0.45)" stroke-width="1.5"/>
    <polygon points="156,64 170,80 142,64" fill="rgba(34,211,238,0.18)"/>
    <!-- "response" lines -->
    <rect x="14" y="14" width="130" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
    <rect x="14" y="27" width="100" height="6" rx="3" fill="rgba(255,255,255,0.22)"/>
    <rect x="14" y="40" width="60" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  </g>
  <!-- Tool icons (right side) -->
  <!-- Magnifier (web search) -->
  <g transform="translate(680, 140)" opacity="0.7">
    <circle cx="18" cy="18" r="13" fill="none" stroke="rgba(34,211,238,0.7)" stroke-width="2.5"/>
    <line x1="28" y1="28" x2="38" y2="38" stroke="rgba(34,211,238,0.7)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Document (PDF Q&A) -->
  <g transform="translate(695, 285)" opacity="0.7">
    <rect x="0" y="0" width="30" height="38" rx="3" fill="none" stroke="rgba(167,139,250,0.7)" stroke-width="2"/>
    <path d="M 18 0 L 18 12 L 30 12" fill="none" stroke="rgba(167,139,250,0.7)" stroke-width="1.5"/>
    <rect x="5" y="18" width="20" height="3" rx="1.5" fill="rgba(167,139,250,0.5)"/>
    <rect x="5" y="25" width="15" height="3" rx="1.5" fill="rgba(167,139,250,0.4)"/>
    <rect x="5" y="32" width="18" height="3" rx="1.5" fill="rgba(167,139,250,0.3)"/>
  </g>
  <!-- Chart/data icon -->
  <g transform="translate(730, 210)" opacity="0.6">
    <rect x="0" y="20" width="8" height="15" rx="2" fill="rgba(34,211,238,0.6)"/>
    <rect x="12" y="10" width="8" height="25" rx="2" fill="rgba(167,139,250,0.6)"/>
    <rect x="24" y="0" width="8" height="35" rx="2" fill="rgba(34,211,238,0.6)"/>
    <line x1="0" y1="36" x2="35" y2="36" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  </g>
  <!-- Title -->
  <text x="400" y="48" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="bold">Lumi — AI Research Assistant</text>
  <text x="400" y="73" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.65)" text-anchor="middle">Smart routing · document Q&amp;A · web search · data analysis</text>
  <!-- Tech strip -->
  <rect x="150" y="360" width="500" height="28" rx="6" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="400" y="379" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">LangChain · Groq · ChromaDB · HuggingFace · Streamlit · Plotly</text>
</svg>
