<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,206,201,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,206,201,0.1)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="400" cy="220" r="180" fill="rgba(0,206,201,0.04)"/>
  <circle cx="400" cy="220" r="110" fill="rgba(0,206,201,0.04)"/>
  <!-- Connection lines -->
  <g stroke="rgba(0,206,201,0.35)" stroke-width="1.5" stroke-dasharray="6,4">
    <line x1="400" y1="220" x2="200" y2="140"/>
    <line x1="400" y1="220" x2="600" y2="140"/>
    <line x1="400" y1="220" x2="185" y2="305"/>
    <line x1="400" y1="220" x2="615" y2="305"/>
    <line x1="400" y1="220" x2="400" y2="345"/>
    <line x1="200" y1="140" x2="600" y2="140"/>
    <line x1="200" y1="140" x2="185" y2="305"/>
    <line x1="600" y1="140" x2="615" y2="305"/>
    <line x1="185" y1="305" x2="400" y2="345"/>
    <line x1="615" y1="305" x2="400" y2="345"/>
  </g>
  <!-- Data packets -->
  <circle cx="300" cy="180" r="4" fill="rgba(0,206,201,0.9)"/>
  <circle cx="500" cy="180" r="4" fill="rgba(0,206,201,0.9)"/>
  <circle cx="292" cy="262" r="4" fill="rgba(0,206,201,0.6)"/>
  <circle cx="508" cy="262" r="4" fill="rgba(0,206,201,0.6)"/>
  <!-- Central master node -->
  <circle cx="400" cy="220" r="36" fill="url(#nodeFill)" stroke="rgba(0,206,201,0.8)" stroke-width="2.5"/>
  <rect x="383" y="206" width="34" height="8" rx="2" fill="rgba(0,206,201,0.7)"/>
  <rect x="383" y="218" width="34" height="8" rx="2" fill="rgba(0,206,201,0.5)"/>
  <rect x="383" y="230" width="34" height="8" rx="2" fill="rgba(0,206,201,0.3)"/>
  <circle cx="412" cy="210" r="2" fill="rgba(255,255,255,0.8)"/>
  <circle cx="412" cy="222" r="2" fill="rgba(255,255,255,0.5)"/>
  <circle cx="412" cy="234" r="2" fill="rgba(255,255,255,0.3)"/>
  <!-- Outer nodes (file/house icon = folder) -->
  <g fill="url(#nodeFill)" stroke="rgba(0,206,201,0.6)" stroke-width="2">
    <circle cx="200" cy="140" r="28"/>
    <circle cx="600" cy="140" r="28"/>
    <circle cx="185" cy="305" r="28"/>
    <circle cx="615" cy="305" r="28"/>
    <circle cx="400" cy="345" r="28"/>
  </g>
  <!-- Folder icons in outer nodes -->
  <g fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="1.5">
    <!-- TL node folder -->
    <path d="M 186 133 L 186 148 L 214 148 L 214 133 L 202 133 L 199 130 L 186 130 Z"/>
    <!-- TR node folder -->
    <path d="M 586 133 L 586 148 L 614 148 L 614 133 L 602 133 L 599 130 L 586 130 Z"/>
    <!-- BL node folder -->
    <path d="M 171 298 L 171 313 L 199 313 L 199 298 L 187 298 L 184 295 L 171 295 Z"/>
    <!-- BR node folder -->
    <path d="M 601 298 L 601 313 L 629 313 L 629 298 L 617 298 L 614 295 L 601 295 Z"/>
    <!-- Bottom node folder -->
    <path d="M 386 338 L 386 353 L 414 353 L 414 338 L 402 338 L 399 335 L 386 335 Z"/>
  </g>
  <!-- Title -->
  <text x="400" y="55" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="bold">Distributed File Storage System</text>
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">Replication · health monitoring · file integrity</text>
  <!-- Tech strip -->
  <rect x="210" y="376" width="380" height="18" rx="4" fill="rgba(0,0,0,0.2)"/>
  <text x="400" y="389" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Python · Django · Docker · MinIO</text>
</svg>
