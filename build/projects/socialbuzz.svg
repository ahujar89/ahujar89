<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Chart axes -->
  <line x1="120" y1="130" x2="120" y2="310" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <line x1="120" y1="310" x2="500" y2="310" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- Horizontal grid lines -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <line x1="120" y1="180" x2="500" y2="180"/>
    <line x1="120" y1="220" x2="500" y2="220"/>
    <line x1="120" y1="260" x2="500" y2="260"/>
  </g>
  <!-- Bar chart bars -->
  <rect x="145" y="175" width="40" height="135" fill="url(#bar1)" rx="3"/>
  <rect x="205" y="195" width="40" height="115" fill="url(#bar2)" rx="3"/>
  <rect x="265" y="155" width="40" height="155" fill="url(#bar1)" rx="3"/>
  <rect x="325" y="210" width="40" height="100" fill="url(#bar2)" rx="3"/>
  <rect x="385" y="168" width="40" height="142" fill="url(#bar1)" rx="3"/>
  <rect x="445" y="190" width="40" height="120" fill="url(#bar2)" rx="3"/>
  <!-- Trend line overlay -->
  <polyline points="165,175 225,200 285,158 345,212 405,170 465,192" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-dasharray="0" stroke-linejoin="round"/>
  <!-- Trend line dots -->
  <circle cx="165" cy="175" r="5" fill="white"/>
  <circle cx="225" cy="200" r="5" fill="white"/>
  <circle cx="285" cy="158" r="5" fill="white"/>
  <circle cx="345" cy="212" r="5" fill="white"/>
  <circle cx="405" cy="170" r="5" fill="white"/>
  <circle cx="465" cy="192" r="5" fill="white"/>
  <!-- Social network graph (right) -->
  <g opacity="0.8">
    <!-- Nodes -->
    <circle cx="620" cy="190" r="18" fill="rgba(245,158,11,0.35)" stroke="rgba(245,158,11,0.8)" stroke-width="2"/>
    <circle cx="680" cy="150" r="14" fill="rgba(167,139,250,0.35)" stroke="rgba(167,139,250,0.8)" stroke-width="2"/>
    <circle cx="700" cy="220" r="14" fill="rgba(167,139,250,0.35)" stroke="rgba(167,139,250,0.8)" stroke-width="2"/>
    <circle cx="640" cy="260" r="12" fill="rgba(245,158,11,0.35)" stroke="rgba(245,158,11,0.7)" stroke-width="2"/>
    <circle cx="740" cy="180" r="12" fill="rgba(245,158,11,0.35)" stroke="rgba(245,158,11,0.7)" stroke-width="2"/>
    <circle cx="750" cy="250" r="10" fill="rgba(167,139,250,0.35)" stroke="rgba(167,139,250,0.7)" stroke-width="2"/>
    <!-- Edges -->
    <g stroke="rgba(255,255,255,0.2)" stroke-width="1.5">
      <line x1="620" y1="190" x2="680" y2="150"/>
      <line x1="620" y1="190" x2="700" y2="220"/>
      <line x1="620" y1="190" x2="640" y2="260"/>
      <line x1="680" y1="150" x2="740" y2="180"/>
      <line x1="700" y1="220" x2="750" y2="250"/>
      <line x1="740" y1="180" x2="750" y2="250"/>
      <line x1="680" y1="150" x2="700" y2="220"/>
    </g>
    <!-- Engagement glow -->
    <circle cx="620" cy="190" r="28" fill="none" stroke="rgba(245,158,11,0.2)" stroke-width="8"/>
  </g>
  <!-- Title -->
  <text x="400" y="55" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="bold">SocialBuzz Data Analytics</text>
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.65)" text-anchor="middle">Content trends · data modelling · strategic insights</text>
  <!-- Tech strip -->
  <rect x="240" y="352" width="320" height="30" rx="6" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="400" y="372" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)" text-anchor="middle">Python · Excel · Power BI</text>
</svg>
