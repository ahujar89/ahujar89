<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Dot grid texture -->
  <g fill="rgba(255,255,255,0.06)">
    <circle cx="50" cy="50" r="2"/><circle cx="100" cy="50" r="2"/><circle cx="150" cy="50" r="2"/>
    <circle cx="200" cy="50" r="2"/><circle cx="250" cy="50" r="2"/><circle cx="300" cy="50" r="2"/>
    <circle cx="350" cy="50" r="2"/><circle cx="400" cy="50" r="2"/><circle cx="450" cy="50" r="2"/>
    <circle cx="500" cy="50" r="2"/><circle cx="550" cy="50" r="2"/><circle cx="600" cy="50" r="2"/>
    <circle cx="650" cy="50" r="2"/><circle cx="700" cy="50" r="2"/><circle cx="750" cy="50" r="2"/>
    <circle cx="50" cy="100" r="2"/><circle cx="100" cy="100" r="2"/><circle cx="150" cy="100" r="2"/>
    <circle cx="200" cy="100" r="2"/><circle cx="750" cy="100" r="2"/><circle cx="700" cy="100" r="2"/>
    <circle cx="50" cy="350" r="2"/><circle cx="100" cy="350" r="2"/><circle cx="700" cy="350" r="2"/><circle cx="750" cy="350" r="2"/>
  </g>

  <!-- Data Factory node -->
  <rect x="60" y="155" width="110" height="90" rx="10" fill="url(#cardFill)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Gear icon -->
  <circle cx="115" cy="185" r="14" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3"/>
  <circle cx="115" cy="185" r="6" fill="rgba(255,255,255,0.7)"/>
  <rect x="112" y="168" width="6" height="6" rx="2" fill="rgba(255,255,255,0.7)"/>
  <rect x="112" y="198" width="6" height="6" rx="2" fill="rgba(255,255,255,0.7)"/>
  <rect x="95" y="182" width="6" height="6" rx="2" fill="rgba(255,255,255,0.7)"/>
  <rect x="125" y="182" width="6" height="6" rx="2" fill="rgba(255,255,255,0.7)"/>
  <text x="115" y="231" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-weight="bold">Data Factory</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="200" x2="208" y2="200" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="206,195 218,200 206,205" fill="rgba(255,255,255,0.5)"/>

  <!-- Databricks node -->
  <rect x="218" y="155" width="110" height="90" rx="10" fill="url(#cardFill)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Spark/lightning -->
  <polygon points="278,168 268,192 276,192 266,215 285,188 275,188" fill="rgba(255,200,50,0.85)"/>
  <text x="273" y="231" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-weight="bold">Databricks</text>

  <!-- Arrow 2 -->
  <line x1="328" y1="200" x2="366" y2="200" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="364,195 376,200 364,205" fill="rgba(255,255,255,0.5)"/>

  <!-- Synapse node -->
  <rect x="376" y="155" width="110" height="90" rx="10" fill="url(#cardFill)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Database cylinders -->
  <ellipse cx="431" cy="178" rx="22" ry="7" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <rect x="409" y="178" width="44" height="18" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="0"/>
  <ellipse cx="431" cy="196" rx="22" ry="7" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="431" y="231" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-weight="bold">Synapse</text>

  <!-- Arrow 3 -->
  <line x1="486" y1="200" x2="524" y2="200" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="522,195 534,200 522,205" fill="rgba(255,255,255,0.5)"/>

  <!-- Data Lake node -->
  <rect x="534" y="155" width="110" height="90" rx="10" fill="url(#cardFill)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Wave/lake shape -->
  <path d="M 549 195 Q 564 183 579 195 Q 594 207 609 195 Q 624 183 634 195" fill="none" stroke="rgba(100,220,255,0.8)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 549 207 Q 564 195 579 207 Q 594 219 609 207 Q 624 195 634 207" fill="none" stroke="rgba(100,220,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  <text x="589" y="231" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-weight="bold">Data Lake</text>

  <!-- Arrow 4 -->
  <line x1="644" y1="200" x2="682" y2="200" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="680,195 692,200 680,205" fill="rgba(255,255,255,0.5)"/>

  <!-- Power BI node -->
  <rect x="692" y="155" width="80" height="90" rx="10" fill="url(#cardFill)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Bar chart -->
  <rect x="708" y="210" width="12" height="20" rx="2" fill="rgba(255,255,255,0.5)"/>
  <rect x="724" y="198" width="12" height="32" rx="2" fill="rgba(255,200,50,0.8)"/>
  <rect x="740" y="205" width="12" height="25" rx="2" fill="rgba(255,255,255,0.5)"/>
  <text x="732" y="231" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-weight="bold">Power BI</text>

  <!-- Title -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="bold">Azure Data Engineering Pipeline</text>
  <text x="400" y="128" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.65)" text-anchor="middle">End-to-end ingestion · transformation · analytics</text>

  <!-- Bottom label -->
  <rect x="260" y="290" width="280" height="36" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="400" y="313" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)" text-anchor="middle">ADF · Databricks · Synapse · Data Lake · Power BI</text>
</svg>
