<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="houseFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Subtle cityscape silhouette at bottom -->
  <g fill="rgba(0,0,0,0.15)">
    <rect x="0" y="310" width="60" height="90"/>
    <rect x="70" y="280" width="50" height="120"/>
    <rect x="130" y="300" width="40" height="100"/>
    <rect x="620" y="295" width="45" height="105"/>
    <rect x="675" y="270" width="55" height="130"/>
    <rect x="740" y="305" width="60" height="95"/>
  </g>
  <!-- Main house (large, center-left) -->
  <g transform="translate(180, 120)">
    <!-- Roof -->
    <polygon points="100,0 195,80 5,80" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <!-- Chimney -->
    <rect x="145" y="15" width="18" height="35" fill="rgba(255,255,255,0.2)"/>
    <!-- Walls -->
    <rect x="15" y="80" width="170" height="110" fill="url(#houseFill)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <!-- Door -->
    <rect x="82" y="140" width="36" height="50" rx="18" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <circle cx="113" cy="165" r="3" fill="rgba(255,255,255,0.6)"/>
    <!-- Windows -->
    <rect x="28" y="95" width="35" height="30" rx="3" fill="rgba(255,200,50,0.25)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="45" y1="95" x2="45" y2="125" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="28" y1="110" x2="63" y2="110" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <rect x="137" y="95" width="35" height="30" rx="3" fill="rgba(255,200,50,0.25)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="154" y1="95" x2="154" y2="125" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="137" y1="110" x2="172" y2="110" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  </g>
  <!-- Location pin -->
  <g transform="translate(530, 110)">
    <path d="M 40 0 C 18 0 0 18 0 40 C 0 70 40 110 40 110 C 40 110 80 70 80 40 C 80 18 62 0 40 0 Z" fill="rgba(255,100,130,0.7)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <circle cx="40" cy="40" r="16" fill="rgba(255,255,255,0.4)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <circle cx="40" cy="40" r="7" fill="rgba(255,255,255,0.8)"/>
  </g>
  <!-- Magnifying glass (search) -->
  <g transform="translate(580, 240)">
    <circle cx="35" cy="35" r="28" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="4"/>
    <line x1="56" y1="56" x2="78" y2="78" stroke="rgba(255,255,255,0.55)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="35" cy="35" r="18" fill="rgba(255,255,255,0.08)"/>
  </g>
  <!-- Title -->
  <text x="400" y="55" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="bold">Real-Estate Finder</text>
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.65)" text-anchor="middle">Scraping · advanced search · smart ranking</text>
  <!-- Tech strip -->
  <rect x="220" y="352" width="360" height="30" rx="6" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="400" y="372" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)" text-anchor="middle">Java · Selenium · Data Structures · Algorithms</text>
</svg>
