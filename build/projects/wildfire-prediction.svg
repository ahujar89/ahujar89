<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="flameFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="flame2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Subtle hex grid texture (map-like) -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1" fill="none">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/>
  </g>

  <!-- Risk zones (heatmap cells) -->
  <rect x="80" y="150" width="80" height="50" fill="rgba(239,68,68,0.4)" rx="2"/>
  <rect x="160" y="100" width="80" height="50" fill="rgba(249,115,22,0.35)" rx="2"/>
  <rect x="240" y="150" width="80" height="50" fill="rgba(239,68,68,0.55)" rx="2"/>
  <rect x="320" y="200" width="80" height="50" fill="rgba(249,115,22,0.3)" rx="2"/>
  <rect x="480" y="150" width="80" height="50" fill="rgba(239,68,68,0.45)" rx="2"/>
  <rect x="560" y="100" width="80" height="50" fill="rgba(239,68,68,0.6)" rx="2"/>
  <rect x="640" y="150" width="80" height="50" fill="rgba(249,115,22,0.35)" rx="2"/>

  <!-- Flame 1 (large, center-left) -->
  <g transform="translate(280, 90)">
    <!-- Outer flame -->
    <path d="M 40 140 C 10 120 0 90 15 60 C 20 80 30 75 28 55 C 45 75 50 60 45 30 C 60 55 75 40 70 15 C 90 45 95 80 80 105 C 75 120 60 135 40 140 Z" fill="url(#flame2)" opacity="0.9"/>
    <!-- Inner flame -->
    <path d="M 40 135 C 22 118 18 95 28 72 C 32 85 38 82 36 66 C 48 80 52 68 50 50 C 62 68 65 85 56 105 C 52 118 48 130 40 135 Z" fill="url(#flameFill)"/>
  </g>

  <!-- Flame 2 (smaller, right) -->
  <g transform="translate(480, 120)">
    <path d="M 30 110 C 8 95 2 70 12 48 C 16 62 24 58 22 44 C 34 58 38 47 35 24 C 46 44 50 65 40 85 C 36 97 30 108 30 110 Z" fill="url(#flame2)" opacity="0.9"/>
    <path d="M 30 106 C 15 93 12 75 20 57 C 23 67 28 64 27 53 C 36 63 39 55 37 38 C 46 55 48 70 42 86 C 38 95 32 103 30 106 Z" fill="url(#flameFill)"/>
  </g>

  <!-- ML scatter plot (bottom right) -->
  <g opacity="0.85">
    <circle cx="580" cy="280" r="5" fill="rgba(239,68,68,0.9)"/>
    <circle cx="605" cy="260" r="5" fill="rgba(239,68,68,0.9)"/>
    <circle cx="630" cy="295" r="5" fill="rgba(239,68,68,0.9)"/>
    <circle cx="655" cy="270" r="5" fill="rgba(249,115,22,0.9)"/>
    <circle cx="680" cy="250" r="5" fill="rgba(249,115,22,0.9)"/>
    <circle cx="700" cy="285" r="5" fill="rgba(239,68,68,0.9)"/>
    <circle cx="720" cy="260" r="5" fill="rgba(254,200,50,0.9)"/>
    <circle cx="740" cy="275" r="5" fill="rgba(254,200,50,0.9)"/>
    <!-- Decision boundary line -->
    <line x1="575" y1="295" x2="745" y2="245" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="6,3"/>
    <!-- Axis labels -->
    <text x="660" y="320" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Risk Prediction Model</text>
  </g>

  <!-- Title -->
  <text x="400" y="58" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="bold">Wildfire Prediction Dashboard</text>
  <text x="400" y="82" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.65)" text-anchor="middle">Climate data · ML risk scoring · geospatial insights</text>

  <!-- Bottom tech strip -->
  <rect x="200" y="350" width="400" height="32" rx="6" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="400" y="371" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)" text-anchor="middle">Python · MongoDB · Machine Learning · Data Visualization</text>
</svg>
